<div class="container flex col gap-1 pa-1"
	[ngClass]="{'selected': isSelected && canBeSelected, 'unselected': !isSelected}">

	<img [src]="contestant.thumbnailUrl"
		[class.image-bg]="imageBg"
		(click)="onClick()">

	<p [style.text-align]="isLeftSide ? 'left' : 'right'">
		@if (contestant.seed) {
			<span class="seed-badge">{{ contestant.seed }}</span>
		}
		<span class="name">{{ contestant.name }}</span>
	</p>
</div>
