<nav>
	<ul class="flex row gap-1">
		@if (onTournament()) {
			<li class="clickable"
				(click)="restart()">

				<span>restart</span>
			</li>

			<li><span>/</span></li>
		}

		<li class="clickable"
			(click)="flipCoin()"
			[ngClass]="{ disabled: showCoin() }">

			<span>flip a coin</span>
		</li>

		<li><span>/</span></li>

		<li class="clickable"
			routerLink="/home">

			<span>home</span>
		</li>
	</ul>
</nav>

@if (showCoin()) {
	<div class="coin"
		[ngClass]="{ finished: finishedSpining() }">

		{{ coinText() }}
	</div>
}
