<nav>
	<ul class="flex row gap-1">
		@if (onPlay()) {
			<li class="clickable"
				(click)="showBracket.set(!showBracket())"
				[ngClass]="{ active: showBracket() }">

				<span>bracket</span>
			</li>

			<li><span>/</span></li>
		}

		@if (onTournament()) {
			<li class="clickable"
				(click)="restart()">

				<span>restart</span>
			</li>

			<li><span>/</span></li>
		}

		<li class="clickable"
			(click)="flipCoin()"
			[ngClass]="{ disabled: showCoin() }">

			<span>flip a coin</span>
		</li>

		<li><span>/</span></li>

		<li class="clickable"
			routerLink="/home">

			<span>home</span>
		</li>
	</ul>
</nav>

@if (showBracket() && onPlay() && bracket(); as bracket) {
	<div class="bracket-overlay">
		<button class="close clickable"
			(click)="closeBracket()"
			aria-label="Close the bracket">&times;</button>

		<app-bracket
			[bracket]="bracket"
			[current]="currentMatch()"
			[imageBg]="imageBg()" />
	</div>
}

@if (showCoin()) {
	<div class="coin"
		[ngClass]="{ finished: finishedSpining() }">

		{{ coinText() }}
	</div>
}
