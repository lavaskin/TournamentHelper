<div class="page contestants flex col pa-1 gap-1">

	<div class="flex row center gap-3">
		<p class="h1">Contestants ({{ numContestants() }})</p>

		<app-button routerLink="play"
			[label]="startLabel()"></app-button>
	</div>

	<!-- The reserve is the height above and below the bracket (padding, the row above, round names, nav bar), so it fits the screen -->
	<app-bracket
		style="--bracket-reserve: 12.5rem"
		[bracket]="bracket()"
		[current]="current()"
		[imageBg]="imageBg()" />

</div>
